<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visão Mudanças Vistorias</title>
<meta name="description" content="Sistema de vistoria, inventário e rastreio de mudanças — Visão Mudanças">
<meta name="theme-color" content="#0B3B24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js" defer></script>
<style>
:root{
  --verde:#16A34A; --verde-claro:#E3F5E9;
  --oliva:#D97706; --oliva-esc:#B45309; --oliva-claro:#FEF3C7;
  --escuro:#0B3B24; --destaque:#FCD34D; --tinta:#10231B; --tinta-2:#4A5A52; --tinta-3:#7D8A83;
  --fundo:#F4F3EC; --card:#FFFFFF; --linha:#E1DED0; --linha-2:#EDEBE2;
  --vermelho:#C2412D; --vermelho-claro:#FBE9E5;
  --ambar:#B7791F; --ambar-claro:#FBF1DC;
  --azul:#2F6690; --azul-claro:#E3EEF6;
  --raio:12px; --sombra:0 1px 2px rgba(16,35,27,.06),0 4px 14px rgba(16,35,27,.05);
  --fonte:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fonte-t:'Archivo Narrow','Archivo',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{font-family:var(--fonte);background:var(--fundo);color:var(--tinta);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--verde)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--fonte-t);letter-spacing:.2px;margin:0;line-height:1.15}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
.muted{color:var(--tinta-3)} .small{font-size:13px} .tiny{font-size:11.5px}
.mono{font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* ---------- layout ---------- */
.topo{position:sticky;top:0;z-index:20;background:var(--escuro);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.topo .marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;min-width:0}
.topo .marca svg{width:34px;height:34px;flex:none}
.topo .marca b{font-family:var(--fonte-t);font-size:19px;color:var(--destaque);display:block;line-height:1}
.topo .marca span{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#BFD8CB}
.topo .esp{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#E6EFEA;padding:5px 10px;border-radius:99px;cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:#7BD39B;display:inline-block}
.sync.pend i{background:#E9C46A} .sync.off i{background:#E76F51} .sync.rodando i{animation:pulsa 1s infinite}
@keyframes pulsa{50%{opacity:.3}}
.app{display:flex;min-height:calc(100vh - 56px)}
.lateral{display:none}
main{flex:1;min-width:0;padding:16px 16px 110px;max-width:1080px;margin:0 auto;width:100%}
.nav-baixo{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--linha);display:flex;justify-content:space-around;padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.nav-baixo a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--tinta-3);text-decoration:none;padding:4px 0;border-radius:10px}
.nav-baixo a svg{width:23px;height:23px}
.nav-baixo a.ativo{color:var(--escuro);font-weight:700}
.nav-baixo a.scan{color:#fff}
.nav-baixo a.scan span.bola{background:var(--verde);width:50px;height:50px;border-radius:50%;display:grid;place-items:center;margin-top:-22px;box-shadow:0 4px 12px rgba(31,138,76,.35);border:4px solid #fff}
@media (min-width:900px){
  .nav-baixo{display:none}
  .lateral{display:block;width:230px;flex:none;background:#fff;border-right:1px solid var(--linha);padding:14px 10px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
  .lateral a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--tinta-2);text-decoration:none;font-weight:500;margin-bottom:2px}
  .lateral a svg{width:19px;height:19px}
  .lateral a.ativo{background:var(--verde-claro);color:var(--escuro);font-weight:700}
  .lateral .grupo{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--tinta-3);margin:16px 12px 6px}
  main{padding:24px 28px 60px}
}
.rodape-dev{text-align:center;font-size:12px;color:var(--tinta-3);padding:22px 16px 8px;border-top:1px solid var(--linha);margin-top:34px}
.rodape-dev a{color:var(--tinta-2);font-weight:600;text-decoration:none}
.rodape-dev b{color:var(--tinta-2)}

/* ---------- componentes ---------- */
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.cab .sub{color:var(--tinta-3);font-size:13px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:16px;box-shadow:var(--sombra)}
.card+.card{margin-top:12px}
.card h3{margin-bottom:10px}
.grade{display:grid;gap:12px}
.grade>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.md-g2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:14px}
.kpi .v{font-family:var(--fonte-t);font-size:30px;font-weight:700;color:var(--escuro);line-height:1}
.kpi .l{font-size:12.5px;color:var(--tinta-3);margin-top:6px}
.kpi.alerta .v{color:var(--vermelho)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--linha);background:#fff;color:var(--tinta);padding:10px 15px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;min-height:42px;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn:hover{border-color:#c9c5b3}
.btn.prim{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.prim:hover{background:#1a7741}
.btn.esc{background:var(--escuro);border-color:var(--escuro);color:#fff}
.btn.perigo{color:var(--vermelho);border-color:#ecc9c1}
.btn.peq{padding:6px 10px;min-height:34px;font-size:13px}
.btn.bloco{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
label.campo{display:block;margin-bottom:12px}
label.campo>span{display:block;font-size:12.5px;font-weight:600;color:var(--tinta-2);margin-bottom:5px}
input:not([type]),input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=tel],input[type=url],input[type=search],select,textarea{width:100%;border:1px solid var(--linha);background:#fff;border-radius:9px;padding:10px 12px;min-height:42px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--verde);box-shadow:0 0 0 3px rgba(31,138,76,.15)}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--linha);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;user-select:none;white-space:nowrap}
.chip.on{background:var(--escuro);color:#fff;border-color:var(--escuro)}
.chips.rolar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--linha-2);color:var(--tinta-2);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.tag.verde{background:var(--verde-claro);color:#17663a}
.tag.oliva{background:var(--oliva-claro);color:var(--oliva-esc)}
.tag.verm{background:var(--vermelho-claro);color:var(--vermelho)}
.tag.amb{background:var(--ambar-claro);color:#8a5a13}
.tag.azul{background:var(--azul-claro);color:var(--azul)}
.tag.esc{background:var(--escuro);color:#fff}
.lista{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--linha-2);text-decoration:none;color:inherit}
.item:last-child{border-bottom:0}
.item .cresce{flex:1;min-width:0}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--tinta-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.item:hover .t{color:var(--verde)}
.vazio{text-align:center;color:var(--tinta-3);padding:28px 10px}
.vazio b{display:block;color:var(--tinta-2);margin-bottom:4px}
.num-vol{font-family:var(--fonte-t);font-weight:700;font-size:20px;min-width:52px;height:44px;border-radius:9px;display:grid;place-items:center;background:var(--oliva-claro);color:var(--oliva-esc);flex:none}
.num-vol.carregado{background:var(--azul-claro);color:var(--azul)}
.num-vol.entregue{background:var(--verde-claro);color:#17663a}
.num-vol.armazenado{background:#ECE6F5;color:#5b3f8c}
.num-vol.extraviado{background:var(--vermelho-claro);color:var(--vermelho)}
.barra{height:10px;background:var(--linha-2);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--verde);border-radius:99px;transition:width .3s}
.barra.azul i{background:var(--azul)}
.abas{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--linha);margin:0 -16px 16px;padding:0 16px;scrollbar-width:none}
.abas a{padding:10px 12px;color:var(--tinta-3);text-decoration:none;font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.abas a.ativo{color:var(--escuro);border-color:var(--verde)}
.trilho{display:flex;gap:0;overflow-x:auto;margin:6px 0 4px;scrollbar-width:none}
.trilho .p{flex:1;min-width:76px;text-align:center;font-size:11px;color:var(--tinta-3);position:relative;padding-top:20px}
.trilho .p::before{content:'';position:absolute;top:6px;left:0;right:0;height:3px;background:var(--linha)}
.trilho .p::after{content:'';position:absolute;top:1px;left:50%;margin-left:-6.5px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--linha)}
.trilho .p.feito::before,.trilho .p.atual::before{background:var(--verde)}
.trilho .p.feito::after{background:var(--verde);border-color:var(--verde)}
.trilho .p.atual::after{border-color:var(--verde);background:#fff;box-shadow:0 0 0 4px var(--verde-claro)}
.trilho .p.atual{color:var(--escuro);font-weight:700}
.tabela{width:100%;border-collapse:collapse;font-size:13.5px}
.tabela th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--tinta-3);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--linha)}
.tabela td{padding:9px 6px;border-bottom:1px solid var(--linha-2);vertical-align:top}
.tabela tr:last-child td{border-bottom:0}
.rolar-x{overflow-x:auto}
.fotos{display:flex;gap:8px;flex-wrap:wrap}
.fotos .f{width:76px;height:76px;border-radius:9px;background:var(--linha-2) center/cover no-repeat;border:1px solid var(--linha);position:relative;cursor:pointer}
.fotos .f button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--vermelho);color:#fff;font-size:13px;line-height:1;cursor:pointer}
.fotos label.add{width:76px;height:76px;border-radius:9px;border:2px dashed #c8c3ad;display:grid;place-items:center;color:var(--tinta-3);cursor:pointer;font-size:11px;text-align:center}
.fotos label.add svg{width:22px;height:22px;display:block;margin:0 auto 2px}
.fotos input{display:none}
.linha-tempo{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--linha)}
.linha-tempo li{position:relative;padding:0 0 14px 6px}
.linha-tempo li::before{content:'';position:absolute;left:-25px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--verde);border:2px solid #fff;box-shadow:0 0 0 1px var(--linha)}
.linha-tempo .q{font-size:12px;color:var(--tinta-3)}
.alerta-box{border-radius:10px;padding:11px 13px;font-size:14px;margin-bottom:12px;display:flex;gap:9px;align-items:flex-start}
.alerta-box.amb{background:var(--ambar-claro);color:#6f4810}
.alerta-box.verm{background:var(--vermelho-claro);color:#8c2c1d}
.alerta-box.verde{background:var(--verde-claro);color:#17532f}
.alerta-box.azul{background:var(--azul-claro);color:#22506f}
.estrelas{display:flex;gap:4px}
.estrelas button{background:none;border:0;font-size:32px;color:#d8d3bd;cursor:pointer;padding:0;line-height:1}
.estrelas button.on{color:#E2B007}
.dupla{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--linha-2);font-size:14px}
.dupla:last-child{border-bottom:0}
.dupla span:first-child{color:var(--tinta-3)}
.dupla span:last-child{text-align:right;font-weight:600}
.barras-h .b{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.barras-h .b span:first-child{width:110px;flex:none;color:var(--tinta-2)}
.barras-h .b .barra{flex:1}
.barras-h .b span:last-child{width:40px;text-align:right;font-weight:700}
.colunas{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px}
.colunas .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.colunas .c i{display:block;width:100%;max-width:34px;background:var(--verde);border-radius:6px 6px 0 0;min-height:2px}
.colunas .c span{font-size:11px;color:var(--tinta-3)}
.colunas .c b{font-size:12px}

/* ---------- modal / toast ---------- */
.modal-fundo{position:fixed;inset:0;background:rgba(10,25,19,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.modal-fundo{align-items:center}}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px 22px;animation:sobe .2s ease}
@media (min-width:700px){.modal{border-radius:16px}}
@keyframes sobe{from{transform:translateY(30px);opacity:0}}
.modal .mcab{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.modal .fechar{background:var(--linha-2);border:0;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;flex:none}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:11px 18px;border-radius:10px;z-index:60;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.toast.erro{background:var(--vermelho)} .toast.ok{background:var(--verde)}
.ass-pad{border:2px dashed #c8c3ad;border-radius:10px;background:#FDFCF7;touch-action:none;width:100%;height:190px;display:block}
#leitor{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:240px}
.scan-res{font-family:var(--fonte-t);font-size:44px;font-weight:700;text-align:center}
.flash-ok{animation:flashok .6s}
@keyframes flashok{0%{background:#c8f0d6}100%{background:#fff}}
.flash-erro{animation:flasherr .6s}
@keyframes flasherr{0%{background:#f6cdc4}100%{background:#fff}}

/* ---------- login / portal ---------- */
.tela-cheia{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(160deg,var(--escuro) 0%,color-mix(in srgb,var(--escuro) 75%,var(--verde)) 60%,color-mix(in srgb,var(--escuro) 70%,var(--oliva)) 100%)}
.tela-cheia .caixa{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.tela-cheia .rodape-dev{border:0;color:#9fbcae}
.tela-cheia .rodape-dev a,.tela-cheia .rodape-dev b{color:#d6e6dd}
.logo-grande{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo-grande svg{width:58px;height:58px}
.logo-grande b{font-family:var(--fonte-t);font-size:30px;color:var(--oliva);line-height:.95;display:block}
.logo-grande span{font-family:var(--fonte-t);font-size:18px;color:var(--escuro);font-weight:700}
.portal-topo{background:var(--escuro);color:#fff;padding:22px 16px 60px}
.portal-topo .in{max-width:760px;margin:0 auto}
.portal-corpo{max-width:760px;margin:-44px auto 0;padding:0 16px 30px}

/* ---------- impressão ---------- */
#print{display:none}
@media print{
  body.imprimindo>*:not(#print){display:none!important}
  body.imprimindo #print{display:block}
  body{background:#fff}
  @page{size:A4;margin:12mm}
}
.doc{font-family:var(--fonte);color:#111;font-size:11.5px;line-height:1.4}
.doc h1{font-size:20px;color:var(--escuro)} .doc h2{font-size:14px;color:var(--escuro);margin:16px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--oliva)}
.doc .dcab{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--escuro);padding-bottom:8px;margin-bottom:10px}
.doc .dcab .lg{display:flex;align-items:center;gap:8px}
.doc .dcab svg{width:42px;height:42px}
.doc .dcab b{font-family:var(--fonte-t);font-size:20px;color:var(--oliva);display:block;line-height:1}
.doc table{width:100%;border-collapse:collapse;margin:4px 0}
.doc th,.doc td{border:1px solid #ccc;padding:4px 5px;text-align:left;vertical-align:top}
.doc th{background:#f0efe6;font-size:10.5px}
.doc .g2{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.doc .fts{display:flex;flex-wrap:wrap;gap:4px}
.doc .fts img{width:88px;height:88px;object-fit:cover;border:1px solid #ccc}
.doc .ass{display:inline-block;text-align:center;margin:8px 18px 0 0}
.doc .ass img{height:60px;display:block;margin:0 auto;border-bottom:1px solid #333}
.doc .drod{margin-top:18px;padding-top:6px;border-top:1px solid #ccc;font-size:9.5px;color:#666;text-align:center}
.doc .quebra{page-break-before:always}
.etiquetas{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.etq{border:1.5px dashed #555;border-radius:3mm;padding:3mm;display:flex;gap:3mm;height:52mm;page-break-inside:avoid;font-family:var(--fonte)}
.etq .qr{width:40mm;flex:none;display:grid;place-items:center}
.etq .qr svg,.etq .qr img{width:40mm;height:40mm}
.etq .n{font-family:var(--fonte-t);font-size:38px;font-weight:700;line-height:1;color:#111}
.etq .cod{font-size:10px;color:#444;letter-spacing:.5px}
.etq .dest{font-size:15px;font-weight:700;margin-top:3px;text-transform:uppercase}
.etq .fr{display:inline-block;background:#111;color:#fff;font-weight:800;padding:1px 6px;font-size:11px;margin-top:3px;letter-spacing:1px}
.etq .mm{font-family:var(--fonte-t);color:var(--oliva-esc);font-size:12px;margin-top:auto}
</style>
</head>
<body>
<div id="raiz"></div>

/* ---------------- toast / modal ---------------- */
function toast(msg, tipo=''){
  const t = document.createElement('div'); t.className = 'toast '+tipo; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), tipo==='erro' ? 4200 : 2600);
}
let MODAL_ABERTO = 0;
function modal(titulo, html, aoAbrir){
  const f = document.createElement('div'); f.className = 'modal-fundo';
  f.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="mcab"><h2>${esc(titulo)}</h2><button class="fechar" aria-label="Fechar">×</button></div><div class="mcorpo">${html}</div></div>`;
  MODAL_ABERTO++;
  const fechar = () => { if (!f.isConnected) return; f.remove(); MODAL_ABERTO--; f.dispatchEvent(new Event('fechou')); };
  f.addEventListener('click', e => { if (e.target === f) fechar(); });
  $('.fechar', f).onclick = fechar;
  document.body.appendChild(f);
  f.fechar = fechar;
  if (aoAbrir) aoAbrir($('.mcorpo', f), fechar);
  return f;
}
function confirmar(msg, ok='Confirmar'){
  return new Promise(res => {
    let r = false;
    const m = modal('Confirmar', `<p style="margin:0 0 18px">${msg}</p><div class="acoes" style="justify-content:flex-end"><button class="btn" data-n>Cancelar</button><button class="btn prim" data-s>${esc(ok)}</button></div>`, (c, fechar) => {
      $('[data-n]', c).onclick = fechar; $('[data-s]', c).onclick = () => { r = true; fechar(); };
    });
    m.addEventListener('fechou', () => res(r));
  });
}

      ['outbox'].forEach(t => d.objectStoreNames.contains(t) || d.createObjectStore(t, {keyPath:'k'}));
      ['blobs','meta'].forEach(t => d.objectStoreNames.contains(t) || d.createObjectStore(t));
    };
    r.onsuccess = () => { IDB.db = r.result; res(); }; r.onerror = () => rej(r.error);
  }); },
  req(store, mode, fn){ return new Promise((res, rej) => {
    const tx = IDB.db.transaction(store, mode); const q = fn(tx.objectStore(store));
    tx.oncomplete = () => res(q ? q.result : undefined); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  }); },
  todos: s => IDB.req(s, 'readonly', st => st.getAll()),
  pega: (s, k) => IDB.req(s, 'readonly', st => st.get(k)),
  poe: (s, v, k) => IDB.req(s, 'readwrite', st => k === undefined ? st.put(v) : st.put(v, k)),
  apaga: (s, k) => IDB.req(s, 'readwrite', st => st.delete(k)),
  limpa: s => IDB.req(s, 'readwrite', st => st.clear())
};

/* ---------------- store local (local-first) ---------------- */
const S = {}; TABELAS.forEach(t => S[t] = new Map());
const OUT = new Map();
const URLS = new Map(); // foto.id -> objectURL

async function carregarLocal(){
  for (const t of TABELAS) (await IDB.todos(t)).forEach(r => S[t].set(r.id, r));
  (await IDB.todos('outbox')).forEach(o => OUT.set(o.k, o));
}
function lista(t, f){ const out = []; for (const r of S[t].values()) if (!r.deleted && (!f || f(r))) out.push(r); return out; }
function pega(t, id){ const r = id && S[t].get(id); return r && !r.deleted ? r : null; }
async function salvar(t, obj){
  const ant = S[t].get(obj.id);
  const r = Object.assign({}, ant || {}, obj);
  if (!r.id) r.id = uuid();
  if (!ant && TEM_CREATED[t] && !r.created_at) r.created_at = agora();
  if (!ant && r.deleted === undefined) r.deleted = false;
  r.updated_at = agora();
  S[t].set(r.id, r);
  await IDB.poe(t, r);
  if (!MODO_DEMO) { const o = { k: t+':'+r.id, t, id: r.id, tent: 0 }; OUT.set(o.k, o); await IDB.poe('outbox', o); }
  agendarSync(); atualizaSyncUI();

}

/* ---------------- sincronização ---------------- */
let SYNC = { rodando:false, ultimo:null, erro:null, timer:null };
function agendarSync(ms=1200){ clearTimeout(SYNC.timer); SYNC.timer = setTimeout(sincronizar, ms); }
const limpaReg = r => { const o = {}; for (const k in r) if (k[0] !== '_') o[k] = r[k]; return o; };

async function sincronizar(manual){
  if (MODO_DEMO || !SB || !SESSAO) { atualizaSyncUI(); return; }
  if (!navigator.onLine) { atualizaSyncUI(); if (manual) toast('Sem internet — os dados ficam salvos no aparelho', 'erro'); return; }
  if (SYNC.rodando) return;
  SYNC.rodando = true; SYNC.erro = null; atualizaSyncUI();
  let mudou = false;
  try {
    // 1) envia fotos pendentes para o Storage
    for (const f of lista('fotos', f => f._pend)) {
      const b = await IDB.pega('blobs', f.id);
      if (b) {
        const { error } = await SB.storage.from('fotos').upload(f.caminho, b, { upsert: true, contentType: 'image/jpeg' });
        if (error && !/exists/i.test(error.message)) throw error;
      }
      const atual = S.fotos.get(f.id); atual._pend = false; await IDB.poe('fotos', atual);
    }
    // 2) envia alterações (ordem respeita chaves estrangeiras)
    for (const t of TABELAS) {
      const pend = [...OUT.values()].filter(o => o.t === t);
      if (!pend.length) continue;
      const snap = pend.map(o => S[t].get(o.id)).filter(r => r && !(t === 'fotos' && r._pend));
      if (!snap.length) continue;
      const marcas = new Map(snap.map(r => [r.id, r.updated_at]));
      const linhas = snap.map(limpaReg);
      const { error } = await SB.from(t).upsert(linhas, { onConflict: 'id', defaultToNull: false });
      const concluir = async id => { const k = t+':'+id; if (S[t].get(id)?.updated_at === marcas.get(id)) { OUT.delete(k); await IDB.apaga('outbox', k); } };
      if (!error) { for (const r of linhas) await concluir(r.id); }
      else {
        for (const r of linhas) {
          const { error: e } = await SB.from(t).upsert([r], { onConflict: 'id', defaultToNull: false });
          const k = t+':'+r.id;
          if (!e) await concluir(r.id);
          else { const o = OUT.get(k); if (!o) continue; o.tent = (o.tent||0)+1; o.erro = e.message;
            if (o.tent >= 5) { OUT.delete(k); await IDB.apaga('outbox', k); console.warn('Descartado após 5 tentativas', t, r.id, e.message); }
            else await IDB.poe('outbox', o);
            SYNC.erro = `${t}: ${e.message}`; }
        }
      }
    }
    // 3) recebe alterações do servidor
    for (const t of TABELAS) {
      const desde = (await IDB.pega('meta', 'pull:'+t)) || '1970-01-01T00:00:00Z';
      let maior = desde, de = 0;
      for (;;) {
        const { data, error } = await SB.from(t).select('*').gt('updated_at', desde).order('updated_at').range(de, de+999);
        if (error) throw error;
        for (const r of data) {
          if (r.updated_at > maior) maior = r.updated_at;
          if (OUT.has(t+':'+r.id)) continue;
          const loc = S[t].get(r.id);
          if (loc && loc._pend) r._pend = loc._pend;
          S[t].set(r.id, r); await IDB.poe(t, r); mudou = true;
        }
        if (data.length < 1000) break; de += 1000;
      }
      await IDB.poe('meta', maior, 'pull:'+t);
    }
    if (SESSAO) { const p = pega('perfis', SESSAO.user.id); if (p) PERFIL = p; }
    SYNC.ultimo = new Date();
    if (manual) toast('Sincronizado', 'ok');
  } catch (e) {
    console.error(e); SYNC.erro = e.message || String(e);
    if (manual) toast('Falha ao sincronizar: '+SYNC.erro, 'erro');
  } finally {
    SYNC.rodando = false; atualizaSyncUI();
    if (mudou && !MODAL_ABERTO && !SCANNER.ativo && !document.activeElement?.matches('input,textarea,select')) render();
  }
}
function atualizaSyncUI(){
  const el = $('#sync'); if (!el) return;
  const n = OUT.size;
  el.className = 'sync' + (SYNC.rodando ? ' rodando' : '') + (MODO_DEMO ? ' pend' : !navigator.onLine || SYNC.erro ? ' off' : n ? ' pend' : '');
  el.innerHTML = `<i></i>${MODO_DEMO ? 'Demonstração' : !navigator.onLine ? `Offline${n?' · '+n:''}` : SYNC.rodando ? 'Sincronizando' : n ? `${n} pendente${n>1?'s':''}` : 'Sincronizado'}`;
}

async function comprimirFoto(arquivo, carimbo){
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(arquivo); });
  const max = 1600; let w = img.naturalWidth, h = img.naturalHeight;
  if (Math.max(w, h) > max) { const k = max / Math.max(w, h); w = Math.round(w*k); h = Math.round(h*k); }
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, w, h);
  URL.revokeObjectURL(img.src);
  // carimbo de data/hora — prova de quando a foto foi tirada
  const fs = Math.max(14, Math.round(w/45)); const faixa = fs*1.9;
  cx.fillStyle = 'rgba(14,59,44,.78)'; cx.fillRect(0, h-faixa, w, faixa);
  cx.fillStyle = '#fff'; cx.font = `600 ${fs}px Archivo, sans-serif`; cx.textBaseline = 'middle';
  cx.fillText(`${carimbo} · ${new Date().toLocaleString('pt-BR')}`, fs*.7, h-faixa/2);
  cx.fillStyle = MARCA.cores.destaque; cx.textAlign = 'right'; cx.fillText(MARCA.curto, w-fs*.7, h-faixa/2);
  return await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.78));
}
function geo(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({lat:p.coords.latitude,lng:p.coords.longitude}), () => res(null), {timeout:4000,maximumAge:120000});
  });
}

/* ---------------- assinatura ---------------- */
function padAssinatura(canvas){
  const r = canvas.getBoundingClientRect(); const dpr = window.devicePixelRatio || 1;
  canvas.width = r.width*dpr; canvas.height = r.height*dpr;
  const cx = canvas.getContext('2d'); cx.scale(dpr, dpr); cx.lineWidth = 2.4; cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.strokeStyle = '#10231B';
  let des = false, usado = false, ult = null;
  const pos = e => { const b = canvas.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top]; };
  canvas.onpointerdown = e => { des = true; usado = true; ult = pos(e); canvas.setPointerCapture(e.pointerId); };
  canvas.onpointermove = e => { if (!des) return; const p = pos(e); cx.beginPath(); cx.moveTo(...ult); cx.lineTo(...p); cx.stroke(); ult = p; };
  canvas.onpointerup = canvas.onpointercancel = () => { des = false; };
  return { limpar(){ cx.clearRect(0,0,canvas.width,canvas.height); usado = false; }, usado: () => usado, png: () => canvas.toDataURL('image/png') };
}

function calcOrcamento(m){
  const cfg = config();
  const itens = lista('orcamento_itens', i => i.mudanca_id === m.id);
  const m3 = soma(itens, i => i.quantidade * i.m3_unit);
  const especiais = soma(itens.filter(i => i.especial), i => i.quantidade);
  const caixas = soma(itens.filter(i => /^Caixa/i.test(i.item)), i => i.quantidade);
  const veic = VEICULOS.find(v => v.m3 >= m3 * 1.15) || { nome: `${Math.ceil(m3*1.15/90)}× Carreta baú`, m3: 90 };
  const ajud = m3 <= 10 ? 2 : m3 <= 25 ? 3 : m3 <= 40 ? 4 : 4 + Math.ceil((m3-40)/15);
  const km = Number(m.distancia_km || 0);
  const emb = m._embalagem !== false;
  const linhas = [
    ['Volume transportado', `${num(m3,2)} m³ × ${moeda(cfg.valor_m3)}`, m3 * cfg.valor_m3],
    ['Deslocamento', `${num(km,0)} km × ${moeda(cfg.valor_km)}`, km * cfg.valor_km],
    ['Equipe', `${ajud} ajudantes × ${moeda(cfg.valor_ajudante)}`, ajud * cfg.valor_ajudante],
    ['Embalagem e proteção', `${num(m3,2)} m³ × ${moeda(cfg.taxa_embalagem_m3)}`, m3 * cfg.taxa_embalagem_m3],
    ['Itens especiais', `${especiais} × ${moeda(cfg.taxa_item_especial)}`, especiais * cfg.taxa_item_especial]
  ];
  return { itens, m3, especiais, caixas, veic, ajud, linhas, total: soma(linhas, l => l[2]) };
}

  [/^#\/mudanca\/([\w-]+)(?:\/(\w+))?$/, vMudanca], [/^#\/escanear$/, vEscanear],

async function render(){

/* ----- avanço de etapa ----- */
async function avancarStatus(m){
  const idx = STATUS.findIndex(s => s[0] === m.status); const prox = STATUS[idx+1]; if (!prox) return;
  const r = resumoVolumes(m.id);
  const ass = e => lista('assinaturas', a => a.mudanca_id === m.id && a.etapa === e).length;
  const avisos = [];
  if (prox[0] === 'aprovada' && !ass('orcamento')) avisos.push('O cliente ainda não assinou a aprovação do orçamento.');
  if (prox[0] === 'carregamento') { if (!r.total) avisos.push('Nenhum volume foi etiquetado no inventário.'); if (!ass('inventario')) avisos.push('O inventário ainda não foi assinado pelo cliente.');
    if (!lista('vistorias_imovel', v => v.mudanca_id === m.id && v.local === 'origem').length) avisos.push('A vistoria do imóvel de origem não foi feita.'); }
  if (prox[0] === 'transito' && r.etiquetado) avisos.push(`${r.etiquetado} volume(s) ainda não foram carregados.`);
  if (prox[0] === 'concluida') { if (r.etiquetado + r.carregado) avisos.push(`${r.etiquetado + r.carregado} volume(s) ainda não foram entregues ou armazenados.`); if (!ass('entrega')) avisos.push('O cliente ainda não assinou o recebimento.'); }
  const msg = `Avançar para <b>${prox[1]}</b>?` + (avisos.length ? `<div class="alerta-box amb small" style="margin-top:10px;display:block">${avisos.map(a => '• '+esc(a)).join('<br>')}</div>` : '');
  if (!(await confirmar(msg, avisos.length ? 'Avançar mesmo assim' : 'Avançar'))) return;
  const extra = {};
  if (prox[0] === 'aprovada' && m.valor_aprovado == null) extra.valor_aprovado = m.valor_orcado;
  await salvar('mudancas', { id: m.id, status: prox[0], ...extra });
  await evento(m.id, 'status', `Etapa: ${prox[1]}`);
  toast(`Mudança em ${prox[1]}`, 'ok'); render();
}

    <button class="btn prim" id="bnv">${ic('mais2')}Novo volume</button>

    ${m.tipo === 'internacional' ? `<button class="btn" id="bpack" ${r.total?'':'disabled'}>${ic('doc')}Packing list (PT/EN)</button>` : ''}

    <div class="kpi"><div class="v">${r.total}</div><div class="l">Volumes</div></div>
    <div class="kpi"><div class="v">${r.comAvaria}</div><div class="l">Com avaria prévia</div></div>
    <div class="kpi"><div class="v">${lista('fotos', f => f.mudanca_id === m.id && f.ref_tipo === 'volume').length}</div><div class="l">Fotos</div></div>
    <div class="kpi"><div class="v" style="font-size:20px">${ehGestor() ? moeda(soma(r.lista, v => v.valor_declarado)) : '—'}</div><div class="l">Valor declarado</div></div>
  </div>
  <div class="card" style="padding:10px 14px">

      <div class="s">${VOL_TIPO[v.tipo]} · ${esc(v.comodo_origem||'?')} → ${esc(v.comodo_destino||'?')} · ${nf} foto${nf===1?'':'s'}</div>
      ${av.length ? `<div class="s" style="color:var(--ambar)">Avaria prévia: ${av.map(a => esc(a.tipo+(a.local?' ('+a.local+')':''))).join(', ')}</div>` : ''}</div>
      <span class="tag ${v.status==='entregue'?'verde':v.status==='extraviado'?'verm':v.status==='carregado'?'azul':''}">${VOL_STATUS[v.status]}</span></div>`; }).join('') || `<div class="vazio"><b>${r.total ? 'Nada encontrado' : 'Nenhum volume ainda'}</b>${r.total ? '' : 'Cadastre cada caixa ou móvel, fotografe e registre avarias que já existem.'}</div>`}</div>

function modalVolume(m, v){

  let avarias = [...(v.avarias_previas||[])];
  const opCom = sel => COMODOS.map(x => `<option ${x===sel?'selected':''}>${x}</option>`).join('') + (sel && !COMODOS.includes(sel) ? `<option selected>${esc(sel)}</option>` : '');
  const fm = modal(novo ? `Volume nº ${v.numero}` : `Volume nº ${v.numero}`, `<form>
    <div class="chips" style="margin-bottom:12px" id="vtipo">${Object.entries(VOL_TIPO).map(([k,n]) => `<span class="chip ${v.tipo===k?'on':''}" data-k="${k}">${n}</span>`).join('')}</div>
    <div class="grade g2"><label class="campo"><span>Cômodo de origem</span><select name="comodo_origem">${opCom(v.comodo_origem)}</select></label>

    <label class="campo"><span>Descrição / conteúdo — ou digite se não estiver na lista</span><input name="descricao" value="${esc(v.descricao||'')}" placeholder="Ex.: Sofá 3 lugares cinza / Louças da cozinha"></label>
    ${ehGestor() || novo ? `<label class="campo"><span>Valor declarado (R$, opcional)</span><input type="number" step="0.01" name="valor_declarado" value="${esc(v.valor_declarado??'')}"></label>` : ''}
    <span class="small" style="font-weight:600;color:var(--tinta-2)">Avarias que JÁ existem (antes da mudança)</span>
    <div id="vav" style="margin:6px 0 8px"></div>
    <div class="grade g2" style="margin-bottom:12px"><select id="avt"><option value="">Tipo de avaria…</option>${AVARIA_TIPOS.map(x => `<option>${x}</option>`).join('')}</select>
      <select id="avl"><option value="">Local…</option>${AVARIA_LOCAIS.map(x => `<option>${x}</option>`).join('')}</select></div>
    <span class="small" style="font-weight:600;color:var(--tinta-2)">Fotos ${novo ? '(salve para fotografar com carimbo do número)' : ''}</span>
    <div id="vfotos" style="margin:6px 0 14px"></div>
    ${!novo ? `<label class="campo"><span>Situação</span><select name="status">${Object.entries(VOL_STATUS).map(([k,n]) => `<option value="${k}" ${v.status===k?'selected':''}>${n}</option>`).join('')}</select></label>` : ''}
    <div class="acoes" style="justify-content:space-between">${!novo ? `<button type="button" class="btn perigo" data-del>${ic('lixo')}Excluir</button>` : '<span></span>'}
    <div class="acoes">${novo ? `<button class="btn" data-mais="1">Salvar e próximo</button>` : `<button type="button" class="btn" data-etq>${ic('impressora')}Etiqueta</button>`}<button class="btn prim">${ic('check')}${novo?'Salvar e fotografar':'Salvar'}</button></div></div>
  </form>`, (c, fechar) => {
    let tipo = v.tipo, proximo = false;
    $('#vtipo', c).onclick = e => { const k = e.target.dataset.k; if (!k) return; tipo = k; $$('#vtipo .chip', c).forEach(x => x.classList.toggle('on', x.dataset.k === k)); };
    const marcaTipo = k => { tipo = k; $$('#vtipo .chip', c).forEach(x => x.classList.toggle('on', x.dataset.k === k)); };
    const desSug = () => {
      const com = $('[name=comodo_origem]', c).value; const amb = ambienteDe(com);

      const feitos = lista('volumes', x => x.mudanca_id === m.id && x.comodo_origem === com && x.id !== v.id).map(x => (x.descricao||'').toLowerCase());
      const nomes = [];
      orc.forEach(i => { const ja = feitos.filter(f => f.startsWith(i.item.toLowerCase())).length; nomes.push([i.item, i.quantidade - ja, 'orc']); });
      (amb ? CATALOGO[amb] : []).concat(itensExtras(amb || com), CATALOGO.Caixas).forEach(([n]) => { if (!nomes.some(x => x[0].toLowerCase() === n.toLowerCase())) nomes.push([n, null, '']); });
      $('#vsug', c).innerHTML = `<div class="chips">${nomes.map(([n, falta, o]) => `<span class="chip ${o ? (falta > 0 ? 'on' : '') : ''}" data-sug="${esc(n)}" title="${o ? 'Do orçamento' : 'Lista do ambiente'}">${esc(n)}${o ? ` <b>${falta > 0 ? falta : '✓'}</b>` : ''}</span>`).join('')}</div>
        ${orc.length ? '<div class="tiny muted" style="margin-top:4px">Em destaque: itens do orçamento que ainda faltam etiquetar neste cômodo.</div>' : ''}`;
      $$('[data-sug]', c).forEach(ch => ch.onclick = () => { const n = ch.dataset.sug; const inp = $('[name=descricao]', c);

    };

    desSug();
    const desAv = () => { $('#vav', c).innerHTML = avarias.length ? `<div class="chips">${avarias.map((a,i) => `<span class="chip on" data-rav="${i}">${esc(a.tipo)}${a.local?' · '+esc(a.local):''} ✕</span>`).join('')}</div>` : '<span class="small muted">Nenhuma — item em bom estado</span>';
      $$('[data-rav]', c).forEach(x => x.onclick = () => { avarias.splice(Number(x.dataset.rav), 1); desAv(); }); };
    desAv();
    const addAv = () => { const t = $('#avt', c).value, l = $('#avl', c).value; if (!t) return; avarias.push({ tipo: t, local: l || null }); $('#avt', c).value = ''; $('#avl', c).value = ''; desAv(); };
    $('#avt', c).onchange = addAv; $('#avl', c).onchange = () => { if ($('#avt', c).value) addAv(); };
    const desFotos = () => {
      if (novo && !pega('volumes', v.id)) { $('#vfotos', c).innerHTML = '<div class="small muted">—</div>'; return; }
      $('#vfotos', c).innerHTML = htmlFotos(fotosDe('volume', v.id), { editar: true });

    };
    desFotos();
    $$('[data-mais]', c).forEach(b => b.onclick = () => { proximo = true; });
    $$('button.prim', c).forEach(b => b.addEventListener('click', () => { proximo = false; }));
    const salvarVol = async (form) => { const d = form2obj(form);
      const ehNovo = !pega('volumes', v.id);
      await salvar('volumes', { id: v.id, mudanca_id: m.id, numero: v.numero, tipo, descricao: nulo(d.descricao), comodo_origem: d.comodo_origem, comodo_destino: d.comodo_destino,
        valor_declarado: d.valor_declarado !== undefined ? numOuNulo(d.valor_declarado) : v.valor_declarado ?? null, avarias_previas: avarias, status: d.status || v.status });
      if (ehNovo && v.numero === 1) await evento(m.id, 'inventario', 'Início do inventário e etiquetagem dos volumes');
      return ehNovo; };
    $('form', c).onsubmit = async e => { e.preventDefault();
      const ehNovo = await salvarVol(e.target);
      if (ehNovo && !proximo) { c.closest('.modal').querySelector('h2').textContent = `Volume nº ${v.numero} — salvo`; $('button.prim', c).innerHTML = `${ic('check')}Concluir`; $('[data-mais]', c).textContent = 'Concluir e próximo'; desFotos(); setTimeout(() => $('#vfotos input', c)?.click(), 100); toast('Volume salvo — agora fotografe', 'ok'); return; }

    };

function escolherEtiquetas(m){

      ${reg ? `<span class="tag ${reg.condicao==='ok'?'verde':reg.condicao==='dano_previo'?'amb':'verm'}">${reg.condicao==='ok'?'OK':reg.condicao==='dano_previo'?'Dano prévio':'Dano novo'}</span>` : '<span class="tag">pendente</span>'}</div>`; }).join('')}</div>

  </div>
  <div class="card"><h3>Assinatura da vistoria (${VIST_SEL.local})</h3>
    ${ass ? `<div class="alerta-box verde small">${ic('check','style="width:18px;flex:none"')}<div>Assinada por <b>${esc(ass.nome)}</b> em ${fmtDH(ass.assinado_em)}</div></div>` : `<button class="btn prim" id="bassv">${ic('caneta')}Cliente/síndico assina a vistoria</button>`}

        des(); };

    des();
    $('form', c).onsubmit = async e => { e.preventDefault(); const d = form2obj(e.target);
      const primeira = !lista('vistorias_imovel', v => v.mudanca_id === m.id && v.local === VIST_SEL.local && v.momento === VIST_SEL.momento).length;
      await salvar('vistorias_imovel', { id, mudanca_id: m.id, local: VIST_SEL.local, momento: VIST_SEL.momento, area, condicao: cond, observacao: nulo(d.observacao) });
      if (primeira) await evento(m.id, 'vistoria', `Vistoria do imóvel de ${VIST_SEL.local} (${VIST_SEL.momento}) iniciada`);
      if (cond === 'dano_novo') { await salvar('ocorrencias', { mudanca_id: m.id, tipo: 'imovel', descricao: `${area} (${VIST_SEL.local}): ${d.observacao || 'dano registrado na vistoria'}`, status: 'aberta' }); toast('Ocorrência aberta automaticamente', 'erro'); }
      fechar(); render(); };
    $('[data-del]', c) && ($('[data-del]', c).onclick = async () => { if (await confirmar('Remover o registro desta área?', 'Remover')) { await remover('vistorias_imovel', id); fechar(); render(); } });
  });

}

/* ----- carga e entrega ----- */
let MODO_CARGA = 'carregar';
async function abaCarga(el, m){
  const r = resumoVolumes(m.id);
  const pctC = r.total ? Math.round((r.total - r.etiquetado) / r.total * 100) : 0;
  const pctE = r.total ? Math.round((r.entregue + r.armazenado) / r.total * 100) : 0;
  const alvo = { carregar: 'carregado', entregar: 'entregue', armazenar: 'armazenado' }[MODO_CARGA];
  const pend = r.lista.filter(v => MODO_CARGA === 'carregar' ? v.status === 'etiquetado' : ['etiquetado','carregado'].includes(v.status));
  const assEnt = lista('assinaturas', a => a.mudanca_id === m.id && a.etapa === 'entrega')[0];
  el.innerHTML = `
  <div class="grade md-g2">
    <div class="card"><h3>Carregamento</h3><div class="barra azul"><i style="width:${pctC}%"></i></div><div class="small muted" style="margin-top:6px">${r.total - r.etiquetado} de ${r.total} volumes no caminhão ou além (${pctC}%)</div></div>
    <div class="card" style="margin-top:0"><h3>Entrega</h3><div class="barra"><i style="width:${pctE}%"></i></div><div class="small muted" style="margin-top:6px">${r.entregue} entregues${r.armazenado?` · ${r.armazenado} no guarda-móveis`:''} de ${r.total} (${pctE}%)</div></div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="chips" id="mcarga" style="margin-bottom:12px">${[['carregar','Carregar no caminhão'],['entregar','Entregar no destino'],['armazenar','Armazenar (guarda-móveis)']].map(([k,n]) => `<span class="chip ${MODO_CARGA===k?'on':''}" data-k="${k}">${n}</span>`).join('')}</div>
    <div id="leitor" class="hide"></div>
    <div id="scanres" class="small muted" style="text-align:center;margin:8px 0"></div>
    <div class="acoes"><button class="btn prim" id="bcam">${ic('scan')}Ler QR com a câmera</button>
      <form id="fnum" style="display:flex;gap:6px;flex:1;min-width:200px"><input type="number" inputmode="numeric" name="n" placeholder="ou digite o nº do volume"><button class="btn">OK</button></form></div>
  </div>
  <div class="card"><h3>Pendentes para ${MODO_CARGA === 'carregar' ? 'carregar' : MODO_CARGA === 'entregar' ? 'entregar' : 'armazenar'} (${pend.length})</h3>
    <div class="lista">${pend.map(v => `<div class="item"><div class="num-vol ${v.status}">${v.numero}</div><div class="cresce"><div class="t">${esc(v.descricao || VOL_TIPO[v.tipo])}</div><div class="s">${esc(v.comodo_origem||'')} → ${esc(v.comodo_destino||'')}</div></div><button class="btn peq" data-mk="${v.id}">${ic('check')}Marcar</button></div>`).join('') || '<div class="vazio">Tudo certo — nenhum pendente.</div>'}</div>
    ${MODO_CARGA !== 'carregar' && pend.length ? `<div class="acoes" style="margin-top:10px"><button class="btn perigo peq" id="bextr">Marcar volume como extraviado…</button></div>` : ''}
  </div>
  ${MODO_CARGA === 'entregar' ? `<div class="card"><h3>Conferência final</h3>
    ${assEnt ? `<div class="alerta-box verde small">${ic('check','style="width:18px;flex:none"')}<div>Recebimento assinado por <b>${esc(assEnt.nome)}</b> em ${fmtDH(assEnt.assinado_em)} — ${r.entregue + r.armazenado} de ${r.total} volumes.</div></div>`
      : `<p class="small muted" style="margin-top:0">Quando todos os volumes forem entregues, colete a assinatura do cliente. Ocorrências abertas aparecem no laudo como ressalva.</p><button class="btn prim" id="bassent" ${r.total?'':'disabled'}>${ic('caneta')}Cliente confere e assina o recebimento</button>`}</div>` : ''}`;
  $('#mcarga').onclick = async e => { if (!e.target.dataset.k) return; MODO_CARGA = e.target.dataset.k; await pararScanner(); render(); };
  const marcar = async (v, origem) => {
    const res = $('#scanres');
    if (!v || v.mudanca_id !== m.id) { if (res) { res.innerHTML = `<b style="color:var(--vermelho)">Volume não pertence a esta mudança</b>`; res.parentElement.classList.remove('flash-erro'); void res.offsetWidth; res.parentElement.classList.add('flash-erro'); } if (navigator.vibrate) navigator.vibrate([80,60,80]); return; }
    if (v.status === alvo) { if (res) res.innerHTML = `<div class="scan-res">${v.numero}</div>já estava ${VOL_STATUS[alvo].toLowerCase()}`; return; }
    const extra = alvo === 'carregado' ? { carregado_em: agora() } : alvo === 'entregue' ? { entregue_em: agora() } : {};
    await salvar('volumes', { id: v.id, status: alvo, ...extra });
    const r2 = resumoVolumes(m.id);
    if (alvo === 'carregado' && r2.carregado === 1 && !r2.entregue) await evento(m.id, 'carga', 'Carregamento iniciado');
    if (alvo === 'carregado' && !r2.etiquetado) await evento(m.id, 'carga', `Todos os ${r2.total} volumes carregados`);
    if (alvo === 'entregue' && r2.entregue === 1) await evento(m.id, 'entrega', 'Descarga no destino iniciada');
    if (alvo !== 'carregado' && !r2.etiquetado && !r2.carregado) await evento(m.id, 'entrega', `Todos os ${r2.total} volumes entregues/armazenados`);
    if (alvo === 'armazenado') await vincularGuarda(m, v);
    if (res) { res.innerHTML = `<div class="scan-res" style="color:var(--verde)">${v.numero} ✓</div>${esc(v.descricao||VOL_TIPO[v.tipo])} — ${VOL_STATUS[alvo]}`; res.parentElement.classList.remove('flash-ok'); void res.offsetWidth; res.parentElement.classList.add('flash-ok'); }
    if (!SCANNER.ativo || origem === 'lista') render();
    else { // atualiza só os números sem fechar a câmera
      const pc = r2.total ? Math.round((r2.total - r2.etiquetado) / r2.total * 100) : 0, pe = r2.total ? Math.round((r2.entregue + r2.armazenado) / r2.total * 100) : 0;
      $$('.barra i', el)[0].style.width = pc+'%'; $$('.barra i', el)[1].style.width = pe+'%';
      const it = el.querySelector(`[data-mk="${v.id}"]`)?.closest('.item'); if (it) it.remove();
    }
  };
  $('#bcam').onclick = async () => {
    if (SCANNER.ativo) { await pararScanner(); $('#leitor').classList.add('hide'); $('#bcam').innerHTML = `${ic('scan')}Ler QR com a câmera`; return; }
    $('#leitor').classList.remove('hide');
    if (await iniciarScanner('leitor', txt => marcar(lerConteudoQR(txt), 'scan'))) $('#bcam').innerHTML = 'Fechar câmera';
    else $('#leitor').classList.add('hide');
  };
  $('#fnum').onsubmit = e => { e.preventDefault(); const n = Number(form2obj(e.target).n); const v = r.lista.find(x => x.numero === n); e.target.reset(); marcar(v || null, 'num'); };
  $$('[data-mk]', el).forEach(b => b.onclick = () => marcar(pega('volumes', b.dataset.mk), 'lista'));
  $('#bextr') && ($('#bextr').onclick = () => modal('Volume extraviado', `<form><label class="campo"><span>Volume</span><select name="v">${pend.map(v => `<option value="${v.id}">${v.numero} — ${esc(v.descricao||VOL_TIPO[v.tipo])}</option>`).join('')}</select></label><button class="btn perigo bloco">Marcar como extraviado e abrir ocorrência</button></form>`, (c, fechar) => {
    $('form', c).onsubmit = async e => { e.preventDefault(); const v = pega('volumes', form2obj(e.target).v);
      await salvar('volumes', { id: v.id, status: 'extraviado' });
      await salvar('ocorrencias', { mudanca_id: m.id, volume_id: v.id, tipo: 'extravio', descricao: `Volume ${v.numero} (${v.descricao||VOL_TIPO[v.tipo]}) não localizado na entrega`, status: 'aberta' });
      await evento(m.id, 'ocorrencia', `Ocorrência: volume ${v.numero} não localizado`); fechar(); render(); };
  }));
  $('#bassent') && ($('#bassent').onclick = async () => {
    const r3 = resumoVolumes(m.id); const oc = lista('ocorrencias', o => o.mudanca_id === m.id && o.status !== 'resolvida').length;
    const termo = `${config().termo_entrega} Volumes: ${r3.entregue} entregues${r3.armazenado?`, ${r3.armazenado} armazenados`:''}${r3.extraviado?`, ${r3.extraviado} extraviados`:''} de ${r3.total}.${oc?` Ocorrências em aberto: ${oc}.`:''}`;
    if (await coletarAssinatura(m, 'entrega', 'Recebimento da mudança', termo)) {
      const mm = pega('mudancas', m.id);
      if (STATUS.findIndex(s => s[0] === mm.status) < STATUS.findIndex(s => s[0] === 'entrega')) await salvar('mudancas', { id: m.id, status: 'entrega' });
      if (await confirmar('Assinatura registrada. Concluir a mudança agora? O cliente poderá avaliar o serviço pelo portal.', 'Concluir')) {
        await salvar('mudancas', { id: m.id, status: 'concluida' }); await evento(m.id, 'status', 'Etapa: Concluída');
      }
      render(); }
  });
}
async function vincularGuarda(m, v){
  let ct = lista('guarda_contratos', g => g.status === 'ativo' && (g.mudanca_id === m.id || g.cliente_id === m.cliente_id))[0];
  if (!ct) { ct = await salvar('guarda_contratos', { mudanca_id: m.id, cliente_id: m.cliente_id, inicio: hojeISO(), valor_mensal: 0, dia_vencimento: 10, status: 'ativo' });
    await evento(m.id, 'guarda', 'Contrato de guarda-móveis aberto'); toast('Contrato de guarda-móveis criado — ajuste o valor em Guarda-móveis'); }
  await salvar('guarda_movimentos', { contrato_id: ct.id, volume_id: v.id, tipo: 'entrada', data: agora() });
}

/* ----- ocorrências ----- */
async function abaOcorrencias(el, m){
  const ocs = lista('ocorrencias', o => o.mudanca_id === m.id).sort((a,b) => a.created_at < b.created_at ? 1 : -1);
  el.innerHTML = `<div class="acoes" style="margin-bottom:12px"><button class="btn prim" id="bnoc">${ic('mais2')}Registrar ocorrência</button></div>
  ${ocs.map(o => { const v = pega('volumes', o.volume_id); const antes = v ? fotosDe('volume', v.id) : []; const depois = fotosDe('ocorrencia', o.id);
    return `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><h3 style="margin:0">${OCOR_TIPO[o.tipo]}${v?` — volume ${v.numero}`:''}</h3><div class="small muted">${fmtDH(o.created_at)}</div></div><span class="tag ${o.status==='resolvida'?'verde':o.status==='aberta'?'verm':'amb'}">${OCOR_STATUS[o.status]}</span></div>
    <p style="margin:10px 0">${esc(o.descricao)}</p>
    ${v ? `<div class="grade g2"><div><div class="small" style="font-weight:700;margin-bottom:4px">ANTES (inventário)</div>${antes.length ? htmlFotos(antes) : '<span class="small muted">Sem fotos</span>'}${(v.avarias_previas||[]).length ? `<div class="tiny" style="color:var(--ambar);margin-top:4px">Avaria prévia: ${v.avarias_previas.map(a => esc(a.tipo)).join(', ')}</div>` : '<div class="tiny muted" style="margin-top:4px">Sem avaria prévia registrada</div>'}</div>
      <div><div class="small" style="font-weight:700;margin-bottom:4px">DEPOIS</div>${depois.length ? htmlFotos(depois) : '<span class="small muted">Sem fotos</span>'}</div></div>` : (depois.length ? htmlFotos(depois) : '')}
    ${o.resolucao || o.responsavel ? `<div class="alerta-box ${o.status==='resolvida'?'verde':'amb'} small" style="margin-top:10px;display:block">${o.responsavel?`<b>Responsabilidade:</b> ${esc(o.responsavel)}<br>`:''}${o.valor_indenizacao?`<b>Indenização:</b> ${moeda(o.valor_indenizacao)}<br>`:''}${o.resolucao?esc(o.resolucao):''}</div>` : ''}
    <div class="acoes" style="margin-top:10px"><button class="btn peq" data-oc="${o.id}">${ic('caneta')}Atualizar</button></div></div>`; }).join('') || '<div class="card"><div class="vazio"><b>Nenhuma ocorrência</b>Avarias, extravios, atrasos ou danos ao imóvel ficam registrados aqui com fotos de antes e depois.</div></div>'}`;
  $('#bnoc').onclick = () => modalOcorrencia(m);
  $$('[data-oc]', el).forEach(b => b.onclick = () => modalOcorrencia(m, pega('ocorrencias', b.dataset.oc)));
}
function modalOcorrencia(m, o){
  const id = o?.id || uuid();
  const vols = resumoVolumes(m.id).lista;
  const fm = modal(o ? 'Atualizar ocorrência' : 'Nova ocorrência', `<form>
    <div class="grade g2"><label class="campo"><span>Tipo</span><select name="tipo">${Object.entries(OCOR_TIPO).map(([k,n]) => `<option value="${k}" ${o?.tipo===k?'selected':''}>${n}</option>`).join('')}</select></label>
    <label class="campo"><span>Volume (se houver)</span><select name="volume_id"><option value="">—</option>${vols.map(v => `<option value="${v.id}" ${o?.volume_id===v.id?'selected':''}>${v.numero} — ${esc(v.descricao||VOL_TIPO[v.tipo])}</option>`).join('')}</select></label></div>
    <label class="campo"><span>Descrição</span><textarea name="descricao" required>${esc(o?.descricao||'')}</textarea></label>
    <span class="small" style="font-weight:600;color:var(--tinta-2)">Fotos do dano</span><div id="ofotos" style="margin:6px 0 14px"></div>
    ${o && ehGestor() ? `<div class="grade g2"><label class="campo"><span>Situação</span><select name="status">${Object.entries(OCOR_STATUS).map(([k,n]) => `<option value="${k}" ${o.status===k?'selected':''}>${n}</option>`).join('')}</select></label>
      <label class="campo"><span>Responsabilidade</span><select name="responsavel"><option value="">A definir</option>${['empresa','cliente','terceiro','preexistente'].map(k => `<option ${o.responsavel===k?'selected':''}>${k}</option>`).join('')}</select></label></div>
      <label class="campo"><span>Indenização (R$)</span><input type="number" step="0.01" name="valor_indenizacao" value="${esc(o.valor_indenizacao??'')}"></label>
      <label class="campo"><span>Resolução</span><textarea name="resolucao">${esc(o.resolucao||'')}</textarea></label>` : ''}
    <button class="btn prim bloco">${ic('check')}Salvar</button></form>`, (c, fechar) => {
    const garantir = async () => { if (!pega('ocorrencias', id)) await salvar('ocorrencias', { id, mudanca_id: m.id, tipo: $('[name=tipo]', c).value, volume_id: nulo($('[name=volume_id]', c).value), descricao: $('[name=descricao]', c).value || 'Ocorrência', status: 'aberta' }); };
    const des = () => { $('#ofotos', c).innerHTML = htmlFotos(fotosDe('ocorrencia', id), { editar: true });
      $('#ofotos input', c).onchange = async e => { await garantir(); for (const f of e.target.files) await adicionarFoto(f, { mudanca_id: m.id, ref_tipo: 'ocorrencia', ref_id: id, legenda: 'Ocorrência', carimbo: `${m.codigo} · Ocorrência` }); des(); };
      $$('[data-del-foto]', c).forEach(b => b.addEventListener('click', () => setTimeout(des, 400))); };
    des();
    $('form', c).onsubmit = async e => { e.preventDefault(); const d = form2obj(e.target); const novo = !pega('ocorrencias', id) || !o;
      const dados = { id, mudanca_id: m.id, tipo: d.tipo, volume_id: nulo(d.volume_id), descricao: d.descricao };
      if (d.status) Object.assign(dados, { status: d.status, responsavel: nulo(d.responsavel), valor_indenizacao: numOuNulo(d.valor_indenizacao), resolucao: nulo(d.resolucao) });
      else if (novo) dados.status = 'aberta';
      await salvar('ocorrencias', dados);
      if (novo) await evento(m.id, 'ocorrencia', `Ocorrência registrada: ${OCOR_TIPO[d.tipo]}`);
      else if (d.status === 'resolvida' && o.status !== 'resolvida') await evento(m.id, 'ocorrencia', `Ocorrência resolvida: ${OCOR_TIPO[d.tipo]}`);
      fechar(); render(); };
  });
  fm.addEventListener('fechou', () => { if (ROTA_ATUAL.includes('/ocorrencias')) render(); });
}

/* ----- laudo ----- */
async function abaLaudo(el, m){

  const r = resumoVolumes(m.id);
  const chk = [
    ['Contrato assinado', ass.some(a => a.etapa === 'orcamento')],
    ['Inventário com fotos', r.total > 0 && lista('fotos', f => f.mudanca_id === m.id && f.ref_tipo === 'volume').length > 0],
    ['Inventário assinado pelo cliente', ass.some(a => a.etapa === 'inventario')],
    ['Vistoria do imóvel de origem', lista('vistorias_imovel', v => v.mudanca_id === m.id && v.local === 'origem').length > 0],
    ['Todos os volumes carregados', r.total > 0 && r.etiquetado === 0],
    ['Vistoria do imóvel de destino', lista('vistorias_imovel', v => v.mudanca_id === m.id && v.local === 'destino').length > 0],
    ['Recebimento assinado', ass.some(a => a.etapa === 'entrega')],
    ['Ocorrências resolvidas', !lista('ocorrencias', o => o.mudanca_id === m.id && o.status !== 'resolvida').length]

  el.innerHTML = `<div class="grade md-g2">
    <div class="card"><h3>Checklist do laudo</h3>${chk.map(([n, ok]) => `<div class="dupla"><span>${n}</span><span style="color:${ok?'var(--verde)':'var(--ambar)'}">${ok?'✓ Feito':'Pendente'}</span></div>`).join('')}</div>
    <div class="card" style="margin-top:0"><h3>Documentos</h3>
      <div class="lista">
        <a class="item" href="#" data-doc="laudo"><div class="cresce"><div class="t">Laudo completo de vistoria da mudança</div><div class="s">Inventário, fotos, vistorias, ocorrências, assinaturas e linha do tempo</div></div>${ic('impressora','style="width:20px"')}</a>
        <a class="item" href="#" data-doc="contrato"><div class="cresce"><div class="t">Contrato de prestação de serviços</div><div class="s">Partes, serviço, valores, cláusulas e assinatura</div></div>${ic('impressora','style="width:20px"')}</a>
        <a class="item" href="#" data-doc="proposta"><div class="cresce"><div class="t">Proposta comercial</div><div class="s">Cubagem, itens e valores</div></div>${ic('impressora','style="width:20px"')}</a>
        <a class="item" href="#" data-doc="etq"><div class="cresce"><div class="t">Etiquetas QR</div><div class="s">${r.total} volumes</div></div>${ic('impressora','style="width:20px"')}</a>
        ${m.tipo === 'internacional' ? `<a class="item" href="#" data-doc="pack"><div class="cresce"><div class="t">Packing list valorado (PT/EN)</div><div class="s">Para alfândega e seguradora</div></div>${ic('impressora','style="width:20px"')}</a>` : ''}
        <a class="item" href="${linkPortal(m)}" target="_blank" rel="noopener"><div class="cresce"><div class="t">Abrir portal do cliente</div><div class="s">Como o cliente vê a mudança</div></div>${ic('link','style="width:20px"')}</a>
      </div>
      <p class="tiny muted" style="margin-bottom:0">Na janela de impressão, escolha “Salvar como PDF” para enviar por WhatsApp ou e-mail.</p></div>
  </div>`;
  $$('[data-doc]', el).forEach(a => a.onclick = e => { e.preventDefault(); const mm = pega('mudancas', m.id);
    ({ laudo: () => imprimir(docLaudo(mm)), contrato: () => imprimir(docContrato(mm)), proposta: () => imprimir(docProposta(mm)), etq: () => imprimir(docEtiquetas(mm, resumoVolumes(mm.id).lista)), pack: () => imprimir(docPackingList(mm)) })[a.dataset.doc](); });
}

async function vEscanear(c){
  c.innerHTML = `<div class="cab"><div><h1>Escanear volume</h1><div class="sub">Aponte para a etiqueta QR de qualquer volume</div></div></div>
  <div class="card"><div id="leitor"></div><div id="gres" style="margin-top:12px"></div>

  const mostrar = v => {
    const g = $('#gres');
    if (!v) { g.innerHTML = `<div class="alerta-box verm">Etiqueta não reconhecida ou volume não sincronizado neste aparelho.</div>`; return; }
    const m = pega('mudancas', v.mudanca_id);
    const acoes = [['carregado','Carregar'],['entregue','Entregar'],['armazenado','Armazenar']].filter(([s]) => s !== v.status);
    g.innerHTML = `<div class="item" style="border:0"><div class="num-vol ${v.status}">${v.numero}</div><div class="cresce"><div class="t">${esc(v.descricao||VOL_TIPO[v.tipo])}</div><div class="s">${esc(m?.codigo||'')} · ${esc(nomeCliente(m?.cliente_id))}</div><div class="s">${esc(v.comodo_origem||'')} → ${esc(v.comodo_destino||'')}</div></div><span class="tag">${VOL_STATUS[v.status]}</span></div>
    <div class="acoes">${acoes.map(([s,n]) => `<button class="btn ${s==='carregado'&&v.status==='etiquetado'||s==='entregue'&&v.status==='carregado'?'prim':''}" data-s="${s}">${n}</button>`).join('')}<a class="btn" href="#/mudanca/${v.mudanca_id}/inventario">Abrir mudança</a></div>`;
    $$('[data-s]', g).forEach(b => b.onclick = async () => { const s = b.dataset.s;
      await salvar('volumes', { id: v.id, status: s, ...(s==='carregado'?{carregado_em:agora()}:s==='entregue'?{entregue_em:agora()}:{}) });
      if (s === 'armazenado' && m) await vincularGuarda(m, v);
      toast(`Volume ${v.numero}: ${VOL_STATUS[s]}`, 'ok'); mostrar(pega('volumes', v.id)); });
  };
  $('#gnum').onsubmit = e => { e.preventDefault(); const t = form2obj(e.target).cod.toUpperCase().split(/\s+/);
    const m = lista('mudancas', x => x.codigo.toUpperCase() === t[0])[0]; const n = Number(t[1]);
    mostrar(m ? lista('volumes', v => v.mudanca_id === m.id && v.numero === n)[0] : null); };
  await iniciarScanner('leitor', txt => mostrar(lerConteudoQR(txt)));
}

function volsContrato(ct){
  const movs = lista('guarda_movimentos', g => g.contrato_id === ct.id).sort((a,b) => a.data < b.data ? -1 : 1);
  const est = new Map(); movs.forEach(mv => mv.volume_id && est.set(mv.volume_id, mv.tipo));
  return [...est.entries()].filter(([,t]) => t === 'entrada').map(([id]) => pega('volumes', id)).filter(Boolean).sort((a,b) => a.numero - b.numero);
}
function proxVenc(ct){
  const d = new Date(hojeISO()+'T12:00:00'); const dia = Number(ct.dia_vencimento||10);
  const v = new Date(d.getFullYear(), d.getMonth(), dia, 12); if (v < d) v.setMonth(v.getMonth()+1);
  return v.toISOString().slice(0,10);
}

/* ---------------- relatórios ---------------- */
async function vRelatorios(c){
  if (!ehGestor()) { c.innerHTML = '<div class="vazio">Acesso restrito à gestão.</div>'; return; }
  const ms = lista('mudancas'); const conc = ms.filter(m => m.status === 'concluida');
  const meses = []; const d0 = new Date(); for (let i = 5; i >= 0; i--) { const d = new Date(d0.getFullYear(), d0.getMonth()-i, 1); meses.push(d.toISOString().slice(0,7)); }
  const porMes = meses.map(mm => ({ mm, n: ms.filter(m => (m.data_prevista||'').startsWith(mm) && m.status !== 'cancelada').length, v: soma(ms.filter(m => (m.data_prevista||'').startsWith(mm) && !['orcamento','cancelada'].includes(m.status)), m => m.valor_aprovado ?? m.valor_orcado) }));
  const maxN = Math.max(1, ...porMes.map(x => x.n)); const maxV = Math.max(1, ...porMes.map(x => x.v));
  const ocs = lista('ocorrencias'); const comOc = new Set(ocs.map(o => o.mudanca_id));
  const taxaOc = conc.length ? conc.filter(m => comOc.has(m.id)).length / conc.length * 100 : 0;
  const porTipoOc = Object.keys(OCOR_TIPO).map(k => [OCOR_TIPO[k], ocs.filter(o => o.tipo === k).length]);
  const maxOc = Math.max(1, ...porTipoOc.map(x => x[1]));
  const porStatus = [...STATUS, ['cancelada','Cancelada']].map(([k,n]) => [n, ms.filter(m => m.status === k).length]); const maxS = Math.max(1, ...porStatus.map(x => x[1]));
  const indeniz = soma(ocs, o => o.valor_indenizacao);
  const notas = ms.filter(m => m.avaliacao_nota);
  const consumo = lista('materiais').map(mt => [mt.nome, soma(lista('consumo_materiais', x => x.material_id === mt.id), x => x.quantidade), mt]);
  const nMes = d => new Date(d+'-15').toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
  const orcs = ms.filter(m => m.status !== 'cancelada'); const aprov = orcs.filter(m => m.status !== 'orcamento');
  c.innerHTML = `<div class="cab"><div><h1>Relatórios</h1><div class="sub">Visão da operação</div></div><button class="btn" id="bexp">${ic('doc')}Exportar CSV de mudanças</button></div>
  <div class="grade g2 g4" style="margin-bottom:12px">
    <div class="kpi"><div class="v">${conc.length}</div><div class="l">Mudanças concluídas</div></div>
    <div class="kpi ${taxaOc>10?'alerta':''}"><div class="v">${num(taxaOc,0)}%</div><div class="l">Concluídas com ocorrência</div></div>
    <div class="kpi"><div class="v" style="font-size:22px">${moeda(indeniz)}</div><div class="l">Indenizações pagas/previstas</div></div>
    <div class="kpi"><div class="v">${notas.length ? num(soma(notas, m => m.avaliacao_nota)/notas.length,1)+' ★' : '—'}</div><div class="l">Satisfação (${notas.length})</div></div>
    <div class="kpi"><div class="v">${orcs.length ? num(aprov.length/orcs.length*100,0)+'%' : '—'}</div><div class="l">Conversão de orçamentos</div></div>
    <div class="kpi"><div class="v">${num(soma(conc, m => m.cubagem_m3),0)}</div><div class="l">m³ transportados</div></div>
    <div class="kpi"><div class="v">${lista('volumes').length}</div><div class="l">Volumes rastreados</div></div>
    <div class="kpi"><div class="v">${lista('fotos').length}</div><div class="l">Fotos de evidência</div></div>
  </div>
  <div class="grade md-g2">
    <div class="card"><h3>Mudanças por mês</h3><div class="colunas">${porMes.map(x => `<div class="c"><b>${x.n}</b><i style="height:${x.n/maxN*100}%"></i><span>${nMes(x.mm)}</span></div>`).join('')}</div></div>
    <div class="card" style="margin-top:0"><h3>Faturamento por mês</h3><div class="colunas">${porMes.map(x => `<div class="c"><b class="tiny">${x.v>=1000?num(x.v/1000,0)+'k':num(x.v,0)}</b><i style="height:${x.v/maxV*100}%;background:var(--oliva)"></i><span>${nMes(x.mm)}</span></div>`).join('')}</div></div>
    <div class="card"><h3>Mudanças por etapa</h3><div class="barras-h">${porStatus.map(([n,v]) => `<div class="b"><span>${n}</span><div class="barra"><i style="width:${v/maxS*100}%"></i></div><span>${v}</span></div>`).join('')}</div></div>
    <div class="card"><h3>Ocorrências por tipo</h3><div class="barras-h">${porTipoOc.map(([n,v]) => `<div class="b"><span>${n}</span><div class="barra"><i style="width:${v/maxOc*100}%;background:var(--vermelho)"></i></div><span>${v}</span></div>`).join('')}</div></div>
    <div class="card"><h3>Materiais consumidos</h3>${consumo.length ? `<table class="tabela"><thead><tr><th>Material</th><th style="text-align:right">Usado</th><th style="text-align:right">Estoque</th></tr></thead><tbody>${consumo.map(([n,q,mt]) => `<tr><td>${esc(n)}</td><td class="mono" style="text-align:right">${num(q,0)}</td><td class="mono" style="text-align:right;${mt.estoque<20?'color:var(--vermelho);font-weight:700':''}">${num(mt.estoque,0)} ${esc(mt.unidade)}</td></tr>`).join('')}</tbody></table>` : '<div class="small muted">Sem materiais.</div>'}</div>
    <div class="card"><h3>Últimas avaliações</h3><div class="lista">${notas.sort((a,b) => a.updated_at < b.updated_at ? 1 : -1).slice(0,6).map(m => `<div class="item"><div class="cresce"><div class="t">${'★'.repeat(m.avaliacao_nota)}<span class="muted">${'★'.repeat(5-m.avaliacao_nota)}</span> ${esc(nomeCliente(m.cliente_id))}</div><div class="s">${esc(m.avaliacao_comentario||'')}</div></div></div>`).join('') || '<div class="small muted">Nenhuma avaliação ainda.</div>'}</div></div>
  </div>`;
  $('#bexp').onclick = () => {
    const cab = ['codigo','cliente','tipo','status','data_prevista','origem','destino','km','m3','volumes','valor','ocorrencias','nota'];
    const linhas = ms.map(m => [m.codigo, nomeCliente(m.cliente_id), m.tipo, m.status, m.data_prevista||'', m.origem_endereco||'', m.destino_endereco||'', m.distancia_km||'', m.cubagem_m3||'', resumoVolumes(m.id).total, m.valor_aprovado ?? m.valor_orcado ?? '', ocs.filter(o => o.mudanca_id === m.id).length, m.avaliacao_nota||'']);
    const csv = [cab, ...linhas].map(l => l.map(x => `"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿'+csv], {type:'text/csv'})); a.download = `mudancas-${hojeISO()}.csv`; a.click();
  };
}

function montarPortalLocal(token){
  const m = lista('mudancas', x => x.token_portal === token)[0]; if (!m) return null;
  const cfg = config();
  return { empresa: cfg, mudanca: m, cliente: { nome: nomeCliente(m.cliente_id) },
    volumes: resumoVolumes(m.id).lista, vistorias: lista('vistorias_imovel', v => v.mudanca_id === m.id),
    ocorrencias: lista('ocorrencias', o => o.mudanca_id === m.id),
    fotos: lista('fotos', f => f.mudanca_id === m.id).map(f => ({ ...f, _url: urlFoto(f) })),
    assinaturas: lista('assinaturas', a => a.mudanca_id === m.id),
    eventos: lista('eventos', e => e.mudanca_id === m.id && e.publico).sort((a,b) => a.created_at < b.created_at ? -1 : 1) };
}

function assinaturaFake(nome){
  const cv = document.createElement('canvas'); cv.width = 320; cv.height = 90; const cx = cv.getContext('2d');
  cx.strokeStyle = '#10231B'; cx.lineWidth = 2.2; cx.beginPath(); let x = 18, y = 55; cx.moveTo(x, y);
  for (let i = 0; i < nome.length * 2; i++) { x += 6 + Math.random()*4; y = 30 + Math.random()*40; cx.quadraticCurveTo(x - 4, y - 18, x, y); }
  cx.stroke(); return cv.toDataURL('image/png');
}

/* ---------------- inicialização ---------------- */
async function entrarDemo(){
  MODO_DEMO = true; localStorage.setItem(LSK('demo'), '1');
  await semearDemo();
  PERFIL = pega('perfis', 'demo') || { id: 'demo', nome: 'Gestor '+MARCA.curto, papel: 'admin', ativo: true };
  if (!location.hash || location.hash === '#') location.hash = '#/inicio';
  moldura(); render();
}
let LOGANDO = false;
async function aposLogin(){
  const uid = SESSAO.user.id;
  if (LOGANDO || (PERFIL && PERFIL.id === uid)) return; LOGANDO = true;
  try { await aposLogin2(uid); } finally { LOGANDO = false; }
}
async function aposLogin2(uid){
  let p = pega('perfis', uid);
  if (!p && navigator.onLine) { const { data } = await SB.from('perfis').select('*').eq('id', uid).maybeSingle(); if (data) { p = data; S.perfis.set(p.id, p); await IDB.poe('perfis', p); } }
  if (!p) return telaLogin('Seu perfil ainda não foi criado. Tente novamente em instantes.');
  if (!p.ativo) return telaLogin('Sua conta foi criada e aguarda liberação do administrador da ' + MARCA.curto + '.');
  PERFIL = p;
  if (!location.hash || location.hash === '#') location.hash = '#/inicio';
  moldura(); render();
  sincronizar();
}
async function iniciar(){
  await IDB.abrir();
  // Dados locais pertencem a uma origem (demonstração ou um servidor). Se a origem mudou
  // (ex.: o aparelho usou a demonstração e agora está conectado), limpa o que é de outra origem.
  const conAtual = conexao(); const origemAtual = conAtual ? conAtual.url : 'demo';
  const origemSalva = await IDB.pega('meta', 'origem');
  let demoAntigo = false; try { demoAntigo = !!localStorage.getItem(LSK('demo')); } catch(e){}
  if ((origemSalva && origemSalva !== origemAtual) || (!origemSalva && conAtual && demoAntigo)) {
    for (const t of [...TABELAS, 'outbox', 'blobs', 'meta']) await IDB.limpa(t);
    try { localStorage.removeItem(LSK('demo')); } catch(e){}
  }
  await IDB.poe('meta', origemAtual, 'origem');
  await carregarLocal();
  await prepararURLsLocais();
  const con = conexao();
  if (con && window.supabase) {
    SB = window.supabase.createClient(con.url, con.key, { auth: { persistSession: true, autoRefreshToken: true } });
  }
  const token = new URLSearchParams(location.search).get('portal');
  if (token) return telaPortal(token);
  if (!SB) {
    if (con && !window.supabase) return telaLogin('Sem internet para carregar o servidor. Abra novamente com conexão.');
    if (localStorage.getItem(LSK('demo'))) return entrarDemo();
    return telaLogin();
  }
  SB.auth.onAuthStateChange((ev, s) => {
    const antes = SESSAO; SESSAO = s;
    if (ev === 'SIGNED_IN' && s) aposLogin();
    if (ev === 'SIGNED_OUT') { PERFIL = null; telaLogin(); }
    if (ev === 'PASSWORD_RECOVERY') { const nova = prompt('Digite a nova senha (mín. 6 caracteres):'); if (nova) SB.auth.updateUser({ password: nova }).then(({error}) => toast(error ? error.message : 'Senha alterada', error ? 'erro' : 'ok')); }
  });
  const { data } = await SB.auth.getSession();
  SESSAO = data.session;
  if (SESSAO) aposLogin(); else telaLogin();
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('load', () => iniciar().catch(e => { console.error(e); document.body.insertAdjacentHTML('afterbegin', `<div class="alerta-box verm" style="margin:16px">Erro ao iniciar: ${esc(e.message)}</div>`); }));

</script>
